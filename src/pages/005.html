<section class="page-section" id="page-005" data-title="Вариант 1"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 1 299f715e19bd80d1b1c9ffca36d540b5</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80d1-b1c9-ffca36d540b5"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 1</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-806f-9d98-d51eacce4823"><a data-notion-page-id="298f715e-19bd-806f-9d98-d51eacce4823" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-006" href="#page-006"><span class="icon" data-emoji="✅"></span>Правила эффективной подготовки к экзамену</a></figure><figure dir="ltr" id="299f715e-19bd-805f-94fc-e29b01319072"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321613/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Влияние процессов генерации и рекомбинации кислородных вакансий и ионов на тепломассоперенос и электрофизические свойства металлооксидного мемристора</div><div class="bookmark-description">Развита теплофизическая модель металлооксидного мемристора на основе стационарного уравнения непрерывности плотности тока электронов, учитывающая процессы генерации и рекомбинации кислородных вакансий. В модель введена скорость рекомбинации кислородных пар ион–вакансия, а для скорости их генерации использовано более точное выражение; введено нестационарное уравнение непрерывности концентрации ионов кислорода, необходимое для определения скорости рекомбинации пар; внесены изменения в формулы коэффициента диффузии и скорости дрейфа вакансий, связанные с температурой и электрическим полем мемристора. Процессы генерации и рекомбинации ионов влияют на перераспределение концентраций вакансий и ионов кислорода, что приводит кроме увеличения плотности электронного тока к изменению электрического поля и, соответственно, величины джоулева источника тепла. Показано, что вольт-амперная кривая при переключении мемристора в высокопроводящее состояние, полученная при учете всех вышеуказанных процессов, обладает наименьшим среднеквадратичным отклонением от экспериментальной кривой. Пренебрежение хотя бы одним из эффектов приводит к значительному росту среднеквадратичного отклонения. В результате численного расчета на основе развитой теплофизической модели мемристора показано, что при учете процессов генерации и рекомбинации кислородных вакансий и ионов существенно изменяется величина профиля температуры по толщине пленки и во времени при моделировании вольт-амперной характеристики мемристора. Точное моделирование резистивного переключения особенно важно при разработке нейроморфных устройств, поскольку электрические схемы искусственных синапсов используют промежуточные резистивные состояния.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321613/</div></div></a></figure></div></article></section>
