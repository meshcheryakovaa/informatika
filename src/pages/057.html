<section class="page-section" id="page-057" data-title="Вариант 6"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 6 299f715e19bd806292dcc65100dda8e0</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8062-92dc-c65100dda8e0"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 6</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8052-ab0e-e9f290216261"><a data-notion-page-id="298f715e-19bd-8052-ab0e-e9f290216261" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-058" href="#page-058"><span class="icon" data-emoji="✅"></span>Разновидности 3D-принтеров</a></figure><figure dir="ltr" id="299f715e-19bd-8021-ab9a-e4c94d4fa205"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-3-35/1198767/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">К вопросу о закономерностях в трансформации параметров относительной фазовой проницаемости при изменении размерности модели нефтяного пласта</div><div class="bookmark-description">В статье приводятся результаты исследований по поиску закономерностей в трансформации параметров функции относительной фазовой проницаемости при изменении размерности математической модели на примере двух синтетических моделей (однослойная латеральная 2D-модель и 0D-модель материального баланса CRM) нефтяной залежи, расположенной в неоднородном пласте и разрабатываемой при заводнении. Установлено, что трансформация параметров относительной фазовой проницаемости связана с фильтрационными свойствами и упругоемкостью пласта, а также со спецификой работы скважин. При этом для трех из пяти параметров сохраняется зависимость от проницаемости, но в иной форме, а для оставшихся двух параметров зависимость теряется. Качество аппроксимации зависимостей практически не зависит от объемов рассмотренных выборок данных. Полученные результаты направлены на совершенствование технологии моделирования разработки месторождений углеводородов, особенно в части иерархического моделирования.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-3-35/1198767/</div></div></a></figure></div></article></section>
