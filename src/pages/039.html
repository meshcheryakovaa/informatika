<section class="page-section" id="page-039" data-title="Вариант 25"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 25 299f715e19bd80059b5ce9ceda0c8602</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8005-9b5c-e9ceda0c8602"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 25</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80c9-9f8f-db366f8a9850"><a data-notion-page-id="298f715e-19bd-80c9-9f8f-db366f8a9850" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-040" href="#page-040"><span class="icon" data-emoji="✅"></span>Правила безопасного дорожного движения</a></figure><figure dir="ltr" id="299f715e-19bd-8068-aa5d-d1ff8ea10c9d"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307174/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Физическая модель турбулентного течения жидкости в трубопроводе на основе электрогидравлической аналогии</div><div class="bookmark-description">В настоящей статье дается описание модели стационарного турбулентного движения ньютоновской жидкости, обладающей массой, упругостью и вязкостью, в трубопроводе. Хаотичное возникновение, срыв и рассеивание вихрей представляется в виде эквивалентного периодического колебательного процесса перехода энергии упругости жидкости совместно с трубопроводом в энергию движения потока и обратно, при котором происходят затраты энергии. Впервые для стационарного турбулентного режима течения вводится понятие комплексного гидравлического сопротивления, которое состоит из вязкого (активного) и турбулентного (реактивного) сопротивлений. Авторами предлагается не игнорировать и не осреднять пульсационные составлящие турбулентного потока, как это представляется в классической теории гидравлического сопротивления трубопровода. Предлагается рассматривать течение жидкости и распространение энергии в движущейся жидкости совместно. Предлагаемая модель турбулентного сопротивления напрямую зависит от частоты постоянной трансформации одного вида энергии в другой, на которую влияют описанные в работе факторы. Управление этими факторами позволит добиться снижения гидравлического сопротивления трубопровода.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307174/</div></div></a></figure></div></article></section>
