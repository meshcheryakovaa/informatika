<section class="page-section" id="page-023" data-title="Вариант 18"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 18 299f715e19bd803b8955fc59c0ab43d9</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-803b-8955-fc59c0ab43d9"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 18</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8013-9d0d-ee7208fb2170"><a data-notion-page-id="298f715e-19bd-8013-9d0d-ee7208fb2170" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-024" href="#page-024"><span class="icon" data-emoji="✅"></span>Экологические привычки в повседневной жизни</a></figure><figure dir="ltr" id="299f715e-19bd-8060-a49d-ec44d0c26686"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246239/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Численное исследование механической устойчивости течения в условиях естественной конвекции</div><div class="bookmark-description">Изучение устойчивости естественной конвекции актуально во многих областях современной науки: астрофизике, метеорологии, теплофизике, ядерной энергетике, машинном обучении и др. Одним из направлений исследований в данной области является численное моделирование конвекции в моменты изменений режима течения жидкости или газа. В статье выполнено детальное моделирование одно- и двухвихревых режимов течения несжимаемой жидкости в квадратной области с разбиением расчетной сеткой с четным и нечетным числом узлов. Промоделированы переходы между этими режимами течения при внесении возмущения в определенные узлы сетки. В начальный момент времени жидкость находится в состоянии покоя. С течением времени в процессе передачи тепла от горячей стороны квадратной области начинается естественная конвекция жидкости, при определенных условиях принимающая форму одного или нескольких вихрей ламинарного течения. В ходе исследования с точки зрения механической устойчивости наблюдался эффект перехода от двухвихревого к одновихревому течению при внесении в начальный момент времени источника возмущения в виде кратного повышения температуры. В работе использована математическая модель естественной конвекции в приближении Буссинеска. Расчеты выполнялись до выхода на стационарный режим течения. Результаты моделирования, полученные для расчетных сеток 20 × 20 и 21 × 21 контрольных объемов представлены на графиках в виде полей давления и температуры, проекций скорости на оси координат, а также в виде изображений линий тока.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246239/</div></div></a></figure></div></article></section>
