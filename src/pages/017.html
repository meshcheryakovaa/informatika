<section class="page-section" id="page-017" data-title="Вариант 15"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 15 299f715e19bd80e89b0dea67052c7157</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80e8-9b0d-ea67052c7157"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 15</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80a3-9dcd-da9d03f9af0e"><a data-notion-page-id="298f715e-19bd-80a3-9dcd-da9d03f9af0e" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-018" href="#page-018"><span class="icon" data-emoji="✅"></span>Способы экономии электроэнергии дома</a></figure><figure dir="ltr" id="299f715e-19bd-8069-b26d-ec67676d94b7"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231537/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Математическое моделирование продолжительности и частоты водопотребления водоразборными устройствами жилого здания</div><div class="bookmark-description">Фактические режимы работы систем водоснабжения не могут быть достаточно подробно и точно охарактеризованы несколькими значениями, полученными в ходе выполнения расчетов по традиционным детерминированным методикам и моделям. Тем не менее задача получения исчерпывающих сведений о режимах функционирования систем водоснабжения может решаться с помощью имитационного моделирования, позволяющего детально анализировать изменчивость водопотребления во времени. При этом наиболее важными составляющими данного процесса, которые должны учитываться при моделировании, являются интенсивность, продолжительность и частота водопотребления. В настоящей статье рассматриваются вопросы математического описания изменчивости продолжительности и частоты водопотребления наиболее распространенными типами водоразборных устройств (смесителями кухонной мойки и ванны / душевой кабины, унитазом со смывным бачком, стиральной и посудомоечной машинами), использующими воду из системы водоснабжения жилого здания. Целью работы является оценка и обоснование теоретических законов распределения продолжительности водопотребления наиболее распространенными типами водоразборных устройств, а также частоты (вероятности) их использования в течение наиболее характерного периода водопотребления (сутки). В работе представлены результаты исследования продолжительности и частоты водопотребления наиболее распространенными типами водоразборных устройств. Приведен анализ построенных по полученным статистическим данным гистограмм и графиков, а также оценок основных числовых характеристик. Выполнена оценка и обоснование теоретических законов распределения продолжительности и частоты (вероятности) водопотребления. В результате выполненного исследования предложен вариант математического описания характера изменчивости продолжительности периодов непрерывного водопотребления наиболее распространенными типами водоразборных устройств, а также частоты (вероятности) их использования в течение суток.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231537/</div></div></a></figure></div></article></section>
