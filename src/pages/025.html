<section class="page-section" id="page-025" data-title="Вариант 19"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 19 299f715e19bd801f985af2b7e09d40af</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-801f-985a-f2b7e09d40af"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 19</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-803c-aca1-c932fc95f8e4"><a data-notion-page-id="298f715e-19bd-803c-aca1-c932fc95f8e4" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-026" href="#page-026"><span class="icon" data-emoji="✅"></span>Основные загрязнители атмосферы</a></figure><figure dir="ltr" id="299f715e-19bd-80ab-8b22-c1c46af42750"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246238/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Эволюция метки трассера в нефтяных пластах с трещиной гидроразрыва</div><div class="bookmark-description">Представлены результаты по развитию микро- и макромодели процесса конвективно-диффузионной эволюции метки трассера в природных коллекторах и описана взаимосвязь между ними. Уравнения для концентрации (плотности) трассера при движении раствора в трещине гидроразрыва и окружающей пористой среде построены с учетом локального химического равновесия. Найдены решения задач о поле концентрации трассера с учетом и без учета вклада диффузионных процессов. Обсуждаются результаты вычислительных экспериментов по моделированию полей скорости метки и концентрации вещества трассера при течении несущей жидкости в трещине гидроразрыва. Показано, что осаждение вещества трассера на скелет на переднем фронте и вымывание на заднем приводит к уменьшению скорости движения метки, причем эта скорость снижается с ростом коэффициента Генри. Применение комбинации методов характеристик и функции Грина позволило уточнить вклад конвективного и диффузионного процессов в эволюцию метки трассера. Полученные результаты предоставляют новые возможности для развития методов интерпретации результатов трассерных исследований, особенно для исследования трещин автогидроразрыва между добывающей и нагнетательной скважинами или двумя нагнетательными.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246238/</div></div></a></figure></div></article></section>
