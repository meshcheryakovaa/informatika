<section class="page-section" id="page-051" data-title="Вариант 30"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 30 299f715e19bd80d69b66eaaaad6d5976</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80d6-9b66-eaaaad6d5976"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 30</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="299f715e-19bd-8048-b79e-f4a04ceda2d5"><a data-notion-page-id="299f715e-19bd-8048-b79e-f4a04ceda2d5" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-052" href="#page-052"><span class="icon" data-emoji="✅"></span>Социальные сети</a></figure><figure dir="ltr" id="299f715e-19bd-80d9-b9ee-c7f0d34dbf66"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321617/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Границы применимости способа определения эффективного радиуса канала, составленного из двух капилляров</div><div class="bookmark-description">Работа посвящена анализу одного из подходов к расчету эффективного радиуса канала, состоящего из двух последовательных цилиндрических капилляров, течение через которые гидродинамически тождественно течению через капилляр постоянного эффективного радиуса. В работе рассматривается аналитический способ расчета эффективного радиуса, который основан на уравнении течения Пуазейля, что делает подход простым и удобным инструментом для составления сложных капиллярных моделей. Ограничивающим фактором метода является его точность, из-за чего необходима оценка параметров задачи, в рамках которых аналитический подход применим. Для этого значение эффективного радиуса, полученного аналитически, сравнивалось с численным значением, полученным с помощью симулятора COMSOL Multiphysics. В работе описаны и проанализированы особенности течения в канале эффективного радиуса, обоснованы возможные причины расхождения аналитического подхода с результатами численных экспериментов, а также определены условия, при которых возможно применение аналитического подхода. Показано, что в рамках уравнения Пуазейля, использование аналитического подхода ограничивают геометрические характеристики канала, такие как отношение радиусов и относительная длина канала. Предложен способ расчета границ области допустимых значений геометрических характеристик и выполнена оценка погрешности предлагаемого подхода.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321617/</div></div></a></figure></div></article></section>
