<section class="page-section" id="page-047" data-title="Вариант 29"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 29 299f715e19bd802b9dece9b38700ab53</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-802b-9dec-e9b38700ab53"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 29</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80f2-8d97-e4cc499b3487"><a data-notion-page-id="298f715e-19bd-80f2-8d97-e4cc499b3487" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-048" href="#page-048"><span class="icon" data-emoji="✅"></span>Правила поведения в аэропорту</a></figure><figure dir="ltr" id="299f715e-19bd-8081-88b0-ff41bab345aa"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321620/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Моделирование дисбаланса ротора нагнетателя, обусловленного отложениями в его проточной части</div><div class="bookmark-description">В работе рассматривается математическая модель, описывающая дисбаланс ротора центробежного нагнетателя, обусловленный неравномерным распределением отложений в проточной части его первой ступени. Целью исследования является количественная оценка величины этого дисбаланса в зависимости от эксплуатационных данных агрегата, допускающих непосредственное измерение. Получено аналитическое выражение для момента силы на роторе нагнетателя, учитывающее зависимости между перераспределенным расходом, динамической вязкостью газа и толщиной слоя отложений, позволяющее оценить величину силы, создающей динамический дисбаланс ротора. Результаты исследования могут быть использованы для диагностики наличия отложений в межлопаточных каналах центробежного нагнетателя природного газа, указывающей на необходимость проведение мероприятий по обслуживанию проточной части агрегата непосредственно по ее техническому состоянию.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-2-42/1321620/</div></div></a></figure></div></article></section>
