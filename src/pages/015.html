<section class="page-section" id="page-015" data-title="Вариант 14"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 14 299f715e19bd807ea8e7d5028acedd70</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-807e-a8e7-d5028acedd70"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 14</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-804f-9d01-f66c593f2186"><a data-notion-page-id="298f715e-19bd-804f-9d01-f66c593f2186" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-016" href="#page-016"><span class="icon" data-emoji="✅"></span>Современные направления в робототехнике</a></figure><figure dir="ltr" id="299f715e-19bd-800e-9f86-d7797fec7fa7"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231545/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Сравнительный анализ методов фильтрации замеров данных скважин сложной конструкции</div><div class="bookmark-description">Статья посвящена сравнительному анализу различных методов фильтрации синтетических замеров, имитирующих данные гидродинамических исследований скважин (ГДИС). Основной целью работы является выявление наиболее эффективных методов фильтрации зашумленных данных ГДИС с позиции сохранения полезной информации и облегчения задачи последующей интерпретации результатов. В качестве исходных данных использовался набор из 200 синтетических кривых снижения давления (КСД) и кривых восстановления давления (КВД) с различным уровнем искусственно внесенного шума. Для фильтрации данных рассматривались как классические методы (фильтр Калмана, фильтр Савицкого — Голея, одномерная фильтрация Гаусса), так и численные методы на основе нейронных сетей (автокодировщики) и методов машинного обучения (метод опорных векторов). В результате сравнительного анализа было продемонстрировано, что результаты применения различных методов фильтрации зависят от типа обрабатываемой кривой (КСД или КВД) и характеристик скважины. Наилучшие показатели по критериям отношения «сигнал — шум» (signal-noise ratio, SNR) и корня среднеквадратической ошибки (RMSE) продемонстрировали современные методы на основе автокодировщиков. Сделан вывод, что выбор оптимального метода фильтрации требует детального анализа специфики задачи и характеристик исходных данных. Предложено комбинирование различных методов фильтрации для повышения качества обработки и интерпретации данных скважин сложной конструкции. Полученные результаты имеют практическую значимость, позволяя упростить решение задачи сегментации КСД и КВД, что необходимо для корректной идентификации различных периодов работы скважины в процессе ее исследования.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231545/</div></div></a></figure></div></article></section>
