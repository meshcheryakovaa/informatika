<section class="page-section" id="page-021" data-title="Вариант 17"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 17 299f715e19bd802682e1ff5e912cda9e</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8026-82e1-ff5e912cda9e"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 17</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-800b-9375-fe54c0b041d8"><a data-notion-page-id="298f715e-19bd-800b-9375-fe54c0b041d8" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-022" href="#page-022"><span class="icon" data-emoji="✅"></span>Возобновляемые источники энергии</a></figure><figure dir="ltr" id="299f715e-19bd-8058-80a4-f9cba5376abc"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231509/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Определение эффективных параметров термостабилизатора в зависимости от его расположения относительно сваи фундамента</div><div class="bookmark-description">Поддержание грунта в мерзлом состоянии в условиях криолитозоны является необходимым условием для предотвращения обрушения конструкций. Наиболее эффективным техническим решением для этого является использование двухфазных сезонных термостабилизаторов. Мониторинг состояния вечномерзлого грунта позволяет принимать своевременные технические решения, предотвращающие протаивание грунта. Определение эффективных параметров таких решений требует математического моделирования тепловых и гидродинамических процессов. Впервые предлагается подход, позволяющий эффективно компенсировать тепловую нагрузку от сваи на грунт, предполагающий расположение термостабилизатора в одной скважине со сваей или на незначительном удалении от нее. Целью работы является расчет эффективных параметров термостабилизатора в зависимости от его расположения относительно сваи. Разработанная математическая модель предполагает выделение пяти задач: 1) обдува надземной части термостабилизатора воздухом; 2) движения жидкого хладагента к нижней части термостабилизатора; 3) охлаждения корпуса термостабилизатора восходящим двухфазным потоком хладагента; 4) теплообмена в системе «хладагент — корпус термостабилизатора — мерзлый грунт»; 5) компенсации теплового потока от сваи в грунт тепловым потоком от грунта в термостабилизатор. Первая задача решается на основе эмпирического критериального уравнения. Вторая и третья задача решаются с использованием законов сохранения массы, импульса и энергии. Четвертая и пятая задача предполагают решение уравнения теплопроводности. В результате расчетов получены эффективные параметры термостабилизатора, позволяющего компенсировать тепловую нагрузку от сваи на грунт при различном расположении установки. Установлены минимальные латеральные размеры корпуса термостабилизатора, обеспечивающие компенсацию теплового потока от сваи в грунт. Определено время достижения фронтом промерзания сваи от термостабилизатора, расположенного на удалении 0,5 м от одного из ее углов.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231509/</div></div></a></figure></div></article></section>
