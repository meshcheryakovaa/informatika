<section class="page-section" id="page-055" data-title="Вариант 5"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 5 299f715e19bd80f2b62ce6eeb25daacc</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80f2-b62c-e6eeb25daacc"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 5</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80a0-927d-dd21ad295b16"><a data-notion-page-id="298f715e-19bd-80a0-927d-dd21ad295b16" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-056" href="#page-056"><span class="icon" data-emoji="✅"></span>Основные компоненты персонального компьютера</a></figure><figure dir="ltr" id="299f715e-19bd-809e-ac00-f57fdd38d5e8"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182887/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Образование наноструктурированной пленки на границе «углеводород — графеновый нанофлюид»</div><div class="bookmark-description">Механизмы взаимодействия между графеновыми наночастицами и молекулами нефти имеют решающее значение для успешного извлечения нефти. В печати ежегодно появляются более сотни исследований, показывающих эффективность использования наножидкостей на основе графеноподобных наночастиц для повышения нефтеотдачи в различных резервуарах. Повышение нефтеотдачи при закачке нанофлюидов объясняется изменением смачиваемости, снижением межфазного натяжения и изменением вязкости. Поэтому знание механизмов взаимодействия графеновых наночастиц с углеводородами является актуальной задачей современной науки, как фундаментальной, так и прикладной.  В работе было проведено комплексное исследование взаимодействия графеновых наночастиц и углеводородов с целью понять механизмы, влияющие на образование микрогетерофазного состояния на границе углеводородов и графеновых нанофлюидов. С помощью методов рентгеноструктурного анализа установлено, что структура микрогетерофазного состояния — это нанокристаллическая пленка. В статье представлены результаты исследования образования пленки на границе «углеводород — графеновый нанофлюид». Установлено, что при различных режимах теплоотвода от границы раздела можно наблюдать как медленный, так и быстрый рост наноструктурированных пленок. При быстром теплоотводе наблюдается медленный рост пленки с образованием фрактальных структур типа множества Мандельброта, при медленном — быстрый рост пленки с формированием сплошной однородной структуры, не являющейся фракталом.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182887/</div></div></a></figure></div></article></section>
