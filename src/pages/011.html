<section class="page-section" id="page-011" data-title="Вариант 12"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 12 299f715e19bd8000aeb3cd6946dcdde5</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8000-aeb3-cd6946dcdde5"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 12</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80b5-b7d7-d806cf0528af"><a data-notion-page-id="298f715e-19bd-80b5-b7d7-d806cf0528af" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-012" href="#page-012"><span class="icon" data-emoji="✅"></span>Принципы работы лазерного станка</a></figure><figure dir="ltr" id="299f715e-19bd-80d7-8099-c18c62fa2d8f"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222719/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Исследование процессов  довытеснения нефти  наносуспензией оксида кремния из модельного керна</div><div class="bookmark-description">Альтернативой химическим методам повышения нефтеотдачи является использование наносуспензий при заводнении пласта. В данной работе показана эффективность применения наносуспензий в качестве агента довытеснения после базового (вода). Проведены фильтрационные испытания по довытеснению нефти из модельных образцов горной породы. Использовались суспензии сферических наночастиц оксида кремния (SiO2), массовая концентрация которых варьировалась от 0,01 до 0,25%масс, а их размер — от 10 до 35 нм. Проницаемость модельного керна составляла 50 мД. Выполнено экспериментальное измерение межфазного натяжения и краевого угла смачивания. Показано, что с повышением концентрации наночастиц, так же как и при фиксированном ее значении (0,1%) с увеличением размера наночастиц, межфазное натяжение «нефть — суспензия» снижается. Установлено, что при использовании суспензий краевой угол смачивания горной породы нефтью значительно меняется. В результате фильтрационных испытаний получены зависимости коэффициента вытеснения нефти от концентрации и размера наночастиц. Показано, что после фильтрации наносуспензий можно извлечь дополнительный объем нефти.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222719/</div></div></a></figure></div></article></section>
