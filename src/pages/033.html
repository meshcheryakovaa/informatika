<section class="page-section" id="page-033" data-title="Вариант 22"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 22 299f715e19bd801faf62ce064e68f1e9</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-801f-af62-ce064e68f1e9"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 22</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80fc-ad35-f86b45bf7502"><a data-notion-page-id="298f715e-19bd-80fc-ad35-f86b45bf7502" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-034" href="#page-034"><span class="icon" data-emoji="✅"></span>Правила безопасного поведения на кухне</a></figure><figure dir="ltr" id="299f715e-19bd-8050-bef4-e08cd97b892c"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-4-40/1255385/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Моделирование влияния неравномерного распределения отложений в проточной части нагнетателя на прецессию его ротора</div><div class="bookmark-description">В работе рассмотрена динамическая модель прецессии вала центробежного нагнетателя газоперекачивающего агрегата с двумя ступенями сжатия и подшипниками скольжения. Прецессия характеризуется траекторией плавания вала на одном из опорных подшипниковых узлов или на двух узлах синхронно. Проведена приближенная оценка силы дисбаланса, возникающей вследствие неравномерности отложений на двух ступенях сжатия (двух рабочих колесах нагнетателя природного газа). Рассчитанные характеристики соотнесены с данными измерений на газоперекачивающем агрегате в процессе его эксплуатации. В работе получено аналитическое выражение для оценки силы, обуславливающей прецессию вала и создающей его дисбаланс. Результаты исследования могут быть использованы для диагностики наличия отложений на рабочих колесах нагнетателя.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-4-40/1255385/</div></div></a></figure></div></article></section>
