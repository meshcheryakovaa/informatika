<section class="page-section" id="page-031" data-title="Вариант 21"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 21 299f715e19bd803f8727da82409579ed</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-803f-8727-da82409579ed"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 21</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80ee-a267-f01fe784df4f"><a data-notion-page-id="298f715e-19bd-80ee-a267-f01fe784df4f" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-032" href="#page-032"><span class="icon" data-emoji="✅"></span>Организация домашнего рабочего места</a></figure><figure dir="ltr" id="299f715e-19bd-805f-8193-feef5fed7605"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-4-40/1255390/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Анализ точности решения задачи двухфазной фильтрации с применением методов нейросетевого моделирования</div><div class="bookmark-description">При проектировании разработки нефтегазовых месторождений требуется применение методов математического моделирования для выбора оптимального варианта разработки месторождений. Одной из важных задач является моделирование динамики обводнения добывающих скважин при действующей системе поддержания пластового давления. Целевыми параметрами для моделирования является время прорыва воды в добывающую скважину и величина обводнения продукции в момент прорыва. На практике подобные расчеты проводят на гидродинамических 3D-симуляторах, основанных на численном решении дифференциальных уравнений фильтрации. Точность численного моделирования при этом очень сильно зависит от качества построения сеточной области расчета, которая, в свою очередь, существенно зависит от формы области расчета. Увеличение размеров сеточных блоков, типичное для гидродинамического моделирования, отрицательно сказывается на точности расчета. Одним из альтернативных методов моделирования физических процессов является нейросетевое моделирование. В последнее время широкое распространение находят физически-информированные нейронные сети, способные с высокой точностью аппроксимировать точные решения дифференциальных уравнений. Ключевой особенностью такого подхода является организация процесса обучения нейронной сети как на точно известных начальных и граничных значениях, так и на выполнении заранее определенных систем дифференциальных и алгебраических уравнений. Обученная нейронная сеть в таком случае позволяет вычислить значение искомых величин в любой точке из области определения, а не только в узловых точках, как происходит при использовании конечно-разностных способов решения. Целью работы является исследование возможностей нейросетевого подхода к решению задач двухфазной фильтрации в крупномасштабном приближении и оценка точности получаемых решений. В работе приводится сравнительный анализ решений одномерной задачи Бакли — Леверетта, имеющей точное решение. Рассмотрены три метода получения решений: точное аналитическое решение, численное решение, полученное конечно-разностными методами, и бессеточная нейросетевая аппроксимация на основе физически информированной нейросети. В качестве конечно-разностного метода использовался метод upwind, позволяющий наиболее точно воспроизводить скачки насыщенности. В качестве физически-информированной нейронной сети использовался многослойный персептрон с двумя видами функций активации. Для определения положения скачка насыщенности требуется включение в функционал ошибки дополнительного условия, соответствующего закону сохранения массы на скачке. Результаты расчета показали, что после обучения нейросетевое решение способно с высокой точностью воспроизводить эволюцию волн разряжения и скачков насыщенности. Плотность расположения узлов обучающей выборки может быть уменьшена без значимого снижения точности нейросетевой аппроксимации. Полученные результаты могут быть использованы при разработке гибридных алгоритмов моделирования процессов вытеснения нефти.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-4-40/1255390/</div></div></a></figure></div></article></section>
