<section class="page-section" id="page-063" data-title="Вариант 9"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 9 299f715e19bd80dcab0ed16687f9960c</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80dc-ab0e-d16687f9960c"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 9</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-800f-b6b9-f73cba1a7a75"><a data-notion-page-id="298f715e-19bd-800f-b6b9-f73cba1a7a75" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-064" href="#page-064"><span class="icon" data-emoji="✅"></span>Этапы сварочного процесса</a></figure><figure dir="ltr" id="299f715e-19bd-8033-8971-d0008aa14248"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210835/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Исследование температурного поля в газоконденсатных пластах с учетом термодинамических эффектов</div><div class="bookmark-description">На основе моделирования неизотермической фильтрации многофазного флюида с учетом термогидродинамических эффектов и теплоты конденсации исследуется формирование поля температуры в однородной пористой среде при различном давлении начала конденсации. Получена численная модель одномерной двухфазной фильтрации с учетом фазового перехода. Тестирование численного решения проведено на основе известного аналитического решения неизотермической двухфазной фильтрации в пласте с учетом переноса массы.  Рассмотрено изменение дебита газа при выпадении конденсата и изменение температуры во времени на стенке скважины. Показано, что в зависимости от давления начала конденсации (радиуса начала конденсации в пласте) наблюдается различный темп формирования температурного поля в пласте после пуска скважины в работу: температурная аномалия может быть положительной, отрицательной или инверсной.  Результаты численных экспериментов могут быть использованы при планировании проведения промысловых исследований в газоконденсатных скважинах.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210835/</div></div></a></figure></div></article></section>
