<section class="page-section" id="page-059" data-title="Вариант 7"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 7 299f715e19bd802eb37dfb227d839ac6</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-802e-b37d-fb227d839ac6"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 7</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80f1-9975-ed5472bbc1b4"><a data-notion-page-id="298f715e-19bd-80f1-9975-ed5472bbc1b4" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-060" href="#page-060"><span class="icon" data-emoji="✅"></span>Основные этапы создания мобильного приложения</a></figure><figure dir="ltr" id="299f715e-19bd-8089-b479-c0ba8220ae1f"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-3-35/1198740/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Оптимизация и актуализация алгоритма расчета интегрированных моделей газоконденсатных месторождений</div><div class="bookmark-description">Моделирование с использованием гидродинамического симулятора tNavigator с опцией Network на данный момент позволяет решать множество задач в области интегрированного моделирования. Однако на сегодняшний день существуют проблемы, вынуждающие либо применять альтернативные методики расчетов, либо вводить допущения. Одной из таких проблем на данный момент является невозможность расчета температур на сети сбора продукции. Целью данной статьи является определение актуальности выбранной проблемы, литературный и технический обзор возможных решений, а также предложение конкретного пути решения для актуализации и оптимизации расчетов температур на сети сбора продукции. В качестве главного из рассматри­ваемых в статье решений предлагается написание на языке Python скрипта для tNavigator, рассчитывающего актуальные температуры в связке с интегрированной моделью, что позволяет исключить риски снижения прибыли проекта в существующих моделях. Научная новизна заключается в использовании эффективного пути решения данной проблемы, который исключает необходимость использовать связку Network tNavigator — PetEx RESOLVE — PetEx GAP, сильно замедляющую расчеты моделей. Выводом может служить предварительная оценка эффективнос­ти и точности предлагаемого решения относительно способа с использованием RESOLVE и GAP.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-3-35/1198740/</div></div></a></figure></div></article></section>
