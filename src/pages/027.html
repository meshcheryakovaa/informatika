<section class="page-section" id="page-027" data-title="Вариант 2"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 2 299f715e19bd80ba9ba7cb555ae931cd</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80ba-9ba7-cb555ae931cd"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 2</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8088-b1a2-cb99635932ab"><a data-notion-page-id="298f715e-19bd-8088-b1a2-cb99635932ab" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-028" href="#page-028"><span class="icon" data-emoji="✅"></span>Основные функции университетской библиотеки</a></figure><figure dir="ltr" id="299f715e-19bd-804f-a06e-dd1018e88a99"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182895/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Моделирование нестационарного давления газа в трубопроводе с путевым отбором и подкачкой</div><div class="bookmark-description">В работе, на основе фундаментальных исследований И. А. Чарного по неустановившемуся движению реальной жидкости в трубах, составлено уравнение, описывающее динамику давления на сложном участке газопровода. Использование импульсной функции Дирака позволило описать одним уравнением динамику нестационарного давления в случае точечного отбора или подкачки в заданных точках. Линеаризация модели путем усреднения скорости движения газа позволила привести уравнение к гиперболическому виду. Если пренебречь силами инерции по сравнению с силами сопротивления, то математическая модель будет представлять уравнение в частных производных параболического типа второго порядка. Динамика давления в конкретных точках отбора и подкачки при граничных условиях второго рода (заданы расходы) получена с помощью конечного косинус-преобразования Фурье.  Рабочая формула, позволяющая определить давление в любой точке в заданный момент времени, представляет собой тригонометрические ряды. Ряды быстро сходящиеся, поэтому трудности работы с ними нет. Рассмотрены частные случаи (без отбора и подкачки). Осуществлена проверка выполнения краевых условий. Легко перестроить рабочую формулу на отбор и/или подкачку в нескольких точках заданного участка.  Произведены расчеты массового расхода и средней скорости. На практике обычно задается давление в начальной и конечной точках исследуемого участка. При этом появляется возможность перейти к расходам (к производным) на концах рассматриваемого участка.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182895/</div></div></a></figure></div></article></section>
