<section class="page-section" id="page-019" data-title="Вариант 16"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 16 299f715e19bd8046b846ea00317f55b5</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8046-b846-ea00317f55b5"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 16</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-807d-be30-d6608bbeb3a2"><a data-notion-page-id="298f715e-19bd-807d-be30-d6608bbeb3a2" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-020" href="#page-020"><span class="icon" data-emoji="✅"></span>Раздельный сбор мусора</a></figure><figure dir="ltr" id="299f715e-19bd-8041-a9b6-d97b3f61e308"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231526/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Воспроизведение геомеханических эффектов при адаптации гидродинамической модели слабосцементированного коллектора</div><div class="bookmark-description">В работе показан подход к адаптации модели вытеснения высоковязкой нефти полимерным раствором из слабосцементированного коллектора с учетом воспроизведения геомеханических эффектов. Данные эффекты проявляются изменением проницаемости в призабойной зоне нагнетательных и добывающих скважин. Исследование предполагает, что природа возникновения зон разуплотнения в большой степени связана с ростом фактора сопротивления вследствие роста скоростей фильтрации, вызванного увеличением объемов закачки агента вытеснения — полимерного раствора. Работа выполнена на базе секторной гидродинамической модели участка опытно-промышленных работ по вытеснению высоковязкой нефти полимерным раствором. Помимо настройки на фактические данные работы скважин в процессе моделирования оценивалась прогностическая способность модели. Учет геомеханических процессов позволил добиться корректного воспроизведения динамики фактического забойного давления при моделировании закачки полимерного раствора в качестве агента вытеснения. Применение описанного подхода ведет к снижению числа неопределенностей моделирования и повышает точность прогноза.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-2-38/1231526/</div></div></a></figure></div></article></section>
