<section class="page-section" id="page-013" data-title="Вариант 13"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 13 299f715e19bd80518e1fff8904bf208f</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8051-8e1f-ff8904bf208f"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 13</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80bc-af41-ff79046ea255"><a data-notion-page-id="298f715e-19bd-80bc-af41-ff79046ea255" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-014" href="#page-014"><span class="icon" data-emoji="✅"></span>Материалы, используемые в аддитивных технологиях</a></figure><figure dir="ltr" id="299f715e-19bd-809d-b2a9-fea4a1ec85d4"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222712/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Моделирование работы термостабилизатора с распределенным подводом хладагента к внешней поверхности</div><div class="bookmark-description">Для предотвращения обрушения зданий и сооружений в условиях криолитозоны из-за протаивания вечномерзлого грунта вследствие тепловой нагрузки от этих объектов необходимо использовать термостабилизаторы. Широкое распространение среди них получили двухфазные пассивные термосифоны, основными преимуществами которых являются высокая степень автономности и отсутствие дополнительных экономических затрат на компрессоры. Для повышения эффективности работы устройства впервые предлагается конструкция с распределенным подводом хладагента к внешней поверхности за счет сегментирования трубы, разделяющей нисходящий и восходящий поток теплоносителя. Определение оптимальных параметров работы такого термостабилиза­тора невозможно без этапа моделирования процессов тепломассопереноса. Всё выше­перечисленное обуславливает цель исследования — расчет распределения температуры в грунте при использовании термостабилизатора с распределенным подводом хладагента к внешней поверхности. Такой расчет проводится с использованием физико-математической модели термостабилизатора с выделением трех связанных задач: 1) описания движения жидкого хладагента по внутренней трубе термосифона под действием гравитационных сил; 2) расчета восходящего потока хладагента в зазоре между внешней трубой термостабилизатора и сегментами разделителя потоков; 3) расчета кондуктивного теплообмена в сис­теме «термостабилизатор — грунт». В основе моделирования лежат подходы неизотермической многофазной механики и теплофизики. Система уравнений для первой задачи решается аналитически, для остальных — численно. Проведен расчет температурного профиля в зазоре между устройством, разделяющим потоки и состоящим из четырех сегментов, и трубой термостабилизатора, а также в грунте на удалении 1 м от поверхности термосифона. Предложенная модель позволяет определить радиальное распределение температуры, согласующееся с практическими данными с точностью 90%. В результате исследования установлено, что использование такого разделяющего устройства позволяет увеличить эффективность снижения температуры грунта на 20%.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222712/</div></div></a></figure></div></article></section>
