<section class="page-section" id="page-007" data-title="Вариант 10"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 10 299f715e19bd80b99bdac949bc39d6ae</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80b9-9bda-c949bc39d6ae"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 10</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8066-a4c7-ef21a9f7efe9"><a data-notion-page-id="298f715e-19bd-8066-a4c7-ef21a9f7efe9" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-008" href="#page-008"><span class="icon" data-emoji="✅"></span>Контроль качества на производстве</a></figure><figure dir="ltr" id="299f715e-19bd-8009-971d-ecd159bb4003"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210833/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Исследование температурного поля в неоднородных по проницаемости пластах при двухфазной фильтрации</div><div class="bookmark-description">Целью работы является исследование температурного поля в неоднородном по проницаемости пласте при нестационарной неизотермической двухфазной фильтра­ции нефти и воды с учетом влияния эффекта Джоуля — Томсона и адиабатического эффекта. Новизна проведенного исследования заключается в установлении закономерностей распределения температуры при двухфазной фильтрации в неоднородном по проницаемости пласте и немонотонного изменения температуры, связанного с двухфазной фильтрацией.  Проведенные численные эксперименты показали, что при нестационарной двухфазной неизотермической фильтрации воды и нефти в призабойной области пласта в неоднородной его зоне формирование температуры происходит с разным темпом в угловом распределении в начальные моменты работы скважины. В зависимости от соотношения проницаемостей пласта и зоны неоднородности и от начальной водонасыщенности пласта, при двухфазной фильтрации в неоднородной области относительно однородной может наблюдаться либо снижение температуры, либо, наоборот, ее повышение.  Полученные результаты могут быть использованы при интерпретации данных температурных измерений многодатчиковой скважинной аппаратурой в неоднородных по проницаемости пластах с многофазными потоками, в частности при решении задач экологии пресноводных горизонтов.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210833/</div></div></a></figure></div></article></section>
