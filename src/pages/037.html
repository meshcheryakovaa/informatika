<section class="page-section" id="page-037" data-title="Вариант 24"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 24 299f715e19bd8012829bf6a22e15465f</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8012-829b-f6a22e15465f"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 24</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-801a-b22e-cf1fcc3e4b9d"><a data-notion-page-id="298f715e-19bd-801a-b22e-cf1fcc3e4b9d" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-038" href="#page-038"><span class="icon" data-emoji="✅"></span>Принципы рационального питания</a></figure><figure dir="ltr" id="299f715e-19bd-8017-857c-dff34f346e67"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307185/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Метод планирования петрофизических исследований для прогнозирования эффективности термополимерного воздействия в условиях ограниченности кернового материала</div><div class="bookmark-description">В настоящий момент хорошо проработаны задачи математической статистики, связанные с планированием экспериментов и получением корреляционных зависимостей. Однако особенно актуально планирование экспериментов в условиях ограниченного набора исследуемых образцов с дискретным детерминированным набором характеристик от нескольких влияющих параметров. Поэтому целью работы является планирование петрофизических экспериментов для получения корреляционных зависимостей коэффициента вытеснения нефти от концентрации полимера, температуры и проницаемости образца керна для последующего моделирования термополимерного воздействия. Впервые предлагается метод, позволяющий использовать один образец керна в нескольких последовательных экспериментах, связанных с таким воздействием. В рамках такого подхода разработан метод определения минимального количества измерений и обоснованного выбора значений измеряемых параметров для полного охвата заданного диапазона с заданной точностью. Этот метод основан на использовании ротатабельного центрально-композиционного планирования эксперимента 2 порядка с учётом особенностей петрофизических фильтрационных экспериментов. Получена минимально необходимая выборка образцов горной породы и значений влияющих параметров и обоснован порядок проведения исследований, позволяющих получить интерполяционную зависимость. Планирование эксперимента и применение аппарата математической статистики позволило в 8 раз сократить количество экспериментов и в 3 раза сократить количество используемого кернового материала для получения искомой корреляции.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307185/</div></div></a></figure></div></article></section>
