<section class="page-section" id="page-049" data-title="Вариант 3"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 3 299f715e19bd80a6ab32cfeb484accfa</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80a6-ab32-cfeb484accfa"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 3</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80a4-a28b-ff14cce987ce"><a data-notion-page-id="298f715e-19bd-80a4-a28b-ff14cce987ce" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-050" href="#page-050"><span class="icon" data-emoji="✅"></span>Источники энергии будущего</a></figure><figure dir="ltr" id="299f715e-19bd-8028-b1d4-f3a2d86e57df"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182889/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Метод расчета относительных фазовых проницаемостей на основе эмпирической функции межфазного взаимодействия</div><div class="bookmark-description">В статье приводятся результаты исследований по разработке эмпирического метода определения функций относительных фазовых проницаемостей. В основе метода лежит расчет функции межфазного взаимодействия по данным физических экспериментов на керне, а также поиск многопараметрических зависимостей для параметров аппроксимационной зависимости этой функции. Для аппроксимации предложено использовать функцию на двух отрезках области определения.  Исследования проведены с использованием лабораторных данных для терригенных и карбонатных групп образцов керна, отобранных с разных месторождений. Установлено, что потери давления из-за межфазного взаимодействия, возникающие при совместном течении водонефтяной смеси, составляют в максимуме для рассмотренных образцов керна от 60 до 90% суммарных потерь давления.  Для обеих групп данных получены многопараметрические зависимости. Показано, что использование многопараметрических зависимостей параметров функции межфазного взаимодействия обеспечивает качество прогнозирования относительных фазовых проницаемостей с погрешностью на уровне 30% для терригенных образцов и 22% для карбонатных.  Проведено исследование влияния объема выборки, по которой строились многопараметрические зависимости (обучающая выборка), на качество прогнозирования ОФП (тестовая выборка). Установлено, что увеличение объема обучающей выборки при формировании многопараметрических зависимостей для функции межфазного взаимодействия положительно влияет на точность прогнозирования функций относительных фазовых проницаемостей. При этом увеличение обучающей выборки в 2 раза приводит к тому, что для терригенной породы средняя относительная погрешность определения относительной фазовой проницаемости уменьшается с 25,5 до 20,9%, а для карбонатной — с 70,3 до 23,6%.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182889/</div></div></a></figure></div></article></section>
