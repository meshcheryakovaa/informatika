<section class="page-section" id="page-043" data-title="Вариант 27"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 27 299f715e19bd80159e65e0cf6a95d77e</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8015-9e65-e0cf6a95d77e"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 27</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8018-87a8-c750dfe96181"><a data-notion-page-id="298f715e-19bd-8018-87a8-c750dfe96181" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-044" href="#page-044"><span class="icon" data-emoji="✅"></span>Этапы планирования поездки</a></figure><figure dir="ltr" id="299f715e-19bd-8015-b9c8-c43dcceac66d"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307168/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Исследование эффективности вытеснения высоковязкого флюида двухфазным теплоносителем в зависимости от скорости подвода тепла в пористую среду и величины тепловых потерь</div><div class="bookmark-description">В работе рассматривается задача вытеснения высоковязкой нефти насыщенным паром, непрерывно закачиваемым в пласт. Для данного процесса была представлена система математических уравнений с использованием уравнения состояния Лихачева-Фогельсона для водяной и нефтяной фаз. Обезразмеривание системы уравнений позволило выявить комплекс подобия, определяющий отношение интенсивности тепловых потерь к скорости подвода тепла в пористую среду. Для различных значений введенного критического числа были рассчитаны поля давления, температуры и насыщенностей фаз. Анализ полученных результатов позволил выявить зависимость эффективности вытеснения от введенного критического числа. Результаты работы могут быть использованы для области разработки проектирования разработки месторождений с высоковязкой нефтью.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2025-tom-11/-1-41/1307168/</div></div></a></figure></div></article></section>
