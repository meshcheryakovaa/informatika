<section class="page-section" id="page-009" data-title="Вариант 11"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 11 299f715e19bd805981e9c3485fe4863c</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8059-81e9-c3485fe4863c"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 11</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8002-8832-d3bc2dc8e3e0"><a data-notion-page-id="298f715e-19bd-8002-8832-d3bc2dc8e3e0" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-010" href="#page-010"><span class="icon" data-emoji="✅"></span>Виды и применение промышленных роботов</a></figure><figure dir="ltr" id="299f715e-19bd-8039-b547-d82bda42b68e"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222721/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Экспериментальное исследование динамических возмущений давления  в цилиндрических трубах, заполненных жидкостью</div><div class="bookmark-description">Диагностика состояния магистральных трубопроводов является важной задачей обеспечения безопасной эксплуатации объектов топливно-энер­гетического комплекса. Многие технологические процессы, в том числе аварийные, вызывают возмущение потока перекачиваемой жидкости, вследствие чего возникают распространяющиеся по трубопроводу динамические возмущения. С помощью приборов измерения давления фиксируются параметры волны, анализируя которые возможно определить местоположение источника и причину, вызывающую данное возмущение. В данной работе исследованы динамические возмущения давления, распространяющиеся по трубопроводу лабораторной установки «Стенд с изменяемым профилем для исследования нестационарных процессов, возникающих в мультифазных углеводородных потоках», созданной в «НИИ Транснефть». Динамические возмущения сформированы за счет отбора части перекачиваемой жидкости в резервуар. Полученные в ходе эксперимента данные с датчиков давления и расхода обрабатывались по предложенной авторами оригинальной методике с целью определения местоположения источника возмущения. Также проведена серия экспериментов для оценки точности локализации источника возмущения в зависимости от величины амплитуды волны давления.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-1-37/1222721/</div></div></a></figure></div></article></section>
