<section class="page-section" id="page-029" data-title="Вариант 20"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 20 299f715e19bd8076965ef84c2d95ba89</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-8076-965e-f84c2d95ba89"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 20</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8020-8f6b-ccd8761d6af9"><a data-notion-page-id="298f715e-19bd-8020-8f6b-ccd8761d6af9" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-030" href="#page-030"><span class="icon" data-emoji="✅"></span>Планирование личного бюджета</a></figure><figure dir="ltr" id="299f715e-19bd-800f-ac81-c80426f25163"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246220/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Об одной методике определения влагосодержания природного газа в трубопроводных системах</div><div class="bookmark-description">В данной исследовательской работе описывается методика определения влагосодержания природного газа в технологических и магистральных трубопроводах различного диаметра. В работе приводится оригинальное эмпирическое уравнение для определения количества влаги, содержащейся в единичном объеме природного газа. Уравнение позволяет определить влагу с учетом ее молярной доли в исследуемом природном газе, а также учитывает соотношение молекулярных масс природного газа и воды. Для повышения точности предложенного уравнения молярную долю воды в газе определяют именно в начале исследуемого участка газопровода путем прямого измерения по ГОСТ 34807—2021. Распределение температуры и давления по длине газопровода определяется по авторской математической модели, которая была опробована и подтверждена экспериментально на различных трубопроводах. Кроме этого, предложенный множитель в уравнении влагосодержания поз­воляет определять тип фазового состояния природного газа, а также может являться косвенным признаком возможного образования газовых гидратов. При сравнении с прямыми измерениями, полученными с действующих газо­проводов, модифицированная формула имеет меньшую погрешность, чем классическое уравнение, что подтверждается графиками, приведенными в данной работе.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2024-tom-10/-3-39/1246220/</div></div></a></figure></div></article></section>
