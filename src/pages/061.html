<section class="page-section" id="page-061" data-title="Вариант 8"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 8 299f715e19bd80bd8e91caa27087dc28</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-80bd-8e91-caa27087dc28"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 8</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-80e9-b0c7-d49b9ecd548d"><a data-notion-page-id="298f715e-19bd-80e9-b0c7-d49b9ecd548d" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-062" href="#page-062"><span class="icon" data-emoji="✅"></span>Преимущества облачных технологий</a></figure><figure dir="ltr" id="299f715e-19bd-80f8-8acc-efbdf24a0d83"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210840/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Линейные фильтрационные волны в слоисто-неоднородном пласте</div><div class="bookmark-description">Получены решения задачи о фильтрационно-волновом поле давления в слоисто-неоднородной среде с заданным на левой границе импульсом давления. Постановка задачи содержит двумерное волновое уравнение в центральном слое, волновое уравнение, учитывающее преобладание вертикального движения в окружающей среде, условия симметрии в центре пласта, равенства давлений и потоков на границах раздела сред, отсутствие возмущений фильтрационно-волнового поля в начальный момент времени и на бесконечном удалении от источника возмущения.  В статье найдены точное решение задачи, полученное с использованием интегральных преобразований Лапласа — Карсона и синус-преобразования Фурье, асимптотическое решение и точное решение для частного случая однородной среды. Показано, что при устремлении формального параметра к нулю точное решение совпадает с главным асимптотическим приближением. Устремление толщины центрального слоя в бесконечность сводит решение для слоисто-неоднородной среды к выражению, описывающему поля давления в однородной среде.  Построены пространственно-временные зависимости, описывающие динамику импульса давления в слоисто-неоднородной и однородной средах. Исследованы общие свойства и особенности линейных фильтрационных волн в слоисто-неод­нородном и однородном пластах.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-4-36/1210840/</div></div></a></figure></div></article></section>
