<section class="page-section" id="page-053" data-title="Вариант 4"><div class="page-meta"><span>Информатика/Контрольная работа по MS Word/Вариант 4 299f715e19bd809c8ac3dcff227174d8</span><a href="#page-000" class="home-link" data-page-target="page-000">Оглавление</a></div><article class="page sans" data-notion-page-icon="✅" id="299f715e-19bd-809c-8ac3-dcff227174d8"><header><div class="page-header-icon undefined"><span class="icon" data-emoji="✅"></span></div><h1 class="page-title" dir="auto">Вариант 4</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><figure class="link-to-page" id="298f715e-19bd-8028-962e-dbddcdf5e713"><a data-notion-page-id="298f715e-19bd-8028-962e-dbddcdf5e713" data-notion-space-id="d23c30fe-2155-45dc-a9bc-a782e0ebc08e" data-page-target="page-054" href="#page-054"><span class="icon" data-emoji="✅"></span>Безопасное поведение в интернете</a></figure><figure dir="ltr" id="299f715e-19bd-8000-a8ec-e1bcee11c178"><a class="bookmark source" href="https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182886/"><div class="bookmark-info"><div class="bookmark-text"><div class="bookmark-title">Прогноз распределения температуры в пласте при вытеснении нефти флюидом с температурой, отличной от пластовой</div><div class="bookmark-description">Температурное поле является важным фактором, который необходимо учитывать при тепловых методах интенсификации добычи нефти. Изменение температурного поля сопровождается, в свою очередь, изменением теплофизических свойств пластовых флюидов и всей призабойной зоны в целом. К таким свойствам относятся, например, изменение вязкости флюидов, фазовые превращения или выпадение парафинов. Прогноз теплового поля в пласте при закачке флюида с температурой, которая отличается от пластовой, является важной и актуальной задачей.  Все описанные выше процессы основаны на прогнозе температурного поля и его эволюции. Для анализа теплового поля в пластах используются модели неизотермической фильтрации, заложенные в дорогостоящие коммерческие симуляторы, которые позволяют рассчитывать его детальную эволюцию в геологически сложных залежах. Однако многие задачи сводятся к определению вероятности активации того или иного теплового процесса в пласте. Поэтому целью данной работы является разработка упрощенной модели эволюции теплового поля в пласте при закачке флюида с температурой, отличной от пластовой.  В данной работе решена стационарная задача о распределении температуры жидкости в стволе нагнетательной скважины. Разработан алгоритм определения коэффициента теплоотдачи по замерам температуры на забое скважины. Сформулирована упрощенная модель формирования температурного поля в пласте при закачке флюида с температурой, отличной от пластовой, в приближении Ловерье. Получена формула для определения среднего значения коэффициента теплоотдачи по всей длине пласта. Показано, что коэффициент теплоотдачи зависит от теплофизических свойств закачиваемого флюида и параметров работы нагнетательной скважины. Показано, что отсутствие замеров теплофизических свойств горных пород и пластовых жидкостей приводит к прогнозам теплового поля с максимальной неопределенностью в ближайшей к нагнетательной скважине половине участка воздействия.</div></div><div class="bookmark-href"><img class="icon bookmark-icon" src="assets/5afeed67c8056da859138254.svg"/>https://vestnik.utmn.ru/energy/vypuski/2023-tom-9/-2-34/1182886/</div></div></a></figure></div></article></section>
